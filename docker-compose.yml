services:
  music-gen:
    build: .
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    ports:
      - "2222:22"  # SSH: ssh root@<host> -p 2222 (host 22 often taken by the pod's own sshd)
    volumes:
      - ./output:/app/output
      - hf-cache:/root/.cache/huggingface
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - SSH_PUBLIC_KEYS=${SSH_PUBLIC_KEYS:-}
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    volumes:
      - ollama-data:/root/.ollama

volumes:
  hf-cache:
  ollama-data:
