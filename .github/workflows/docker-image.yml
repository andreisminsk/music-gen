name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Log in to ghcr.io
      run: echo "${{ secrets.CR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag ghcr.io/${{ github.repository_owner }}/music-gen:0.1.0

    - name: Check image size
      run: |
        echo "=== Docker image size ==="
        docker images ghcr.io/${{ github.repository_owner }}/music-gen:0.1.0 --format "table {{.Repository}}:{{.Tag}}\t{{.Size}}"
        echo ""
        echo "=== Disk usage on runner ==="
        df -h /

    - name: Push image to ghcr.io
      run: |
        docker push ghcr.io/${{ github.repository_owner }}/music-gen:0.1.0
