name: Docker Image CI
# Re-registered 2026-10-22: GitHub had marked the workflow state as "deleted"
# after commit 6c7cc29; a trivial touch re-registers it.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Log in to ghcr.io
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag ghcr.io/${{ github.repository_owner }}/music-gen:0.2.0-torch2.10.0-cu128

    - name: Check image size
      run: |
        echo "=== Docker image size ==="
        docker images ghcr.io/${{ github.repository_owner }}/music-gen:0.2.0-torch2.10.0-cu128 --format "table {{.Repository}}:{{.Tag}}\t{{.Size}}"
        echo ""
        echo "=== Disk usage on runner ==="
        df -h /

    - name: Push image to ghcr.io
      run: |
        docker push ghcr.io/${{ github.repository_owner }}/music-gen:0.2.0-torch2.10.0-cu128
